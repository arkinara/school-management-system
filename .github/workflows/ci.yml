name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Prettier format check
        run: pnpm --filter frontend format:check

      - name: Build (check)
        run: pnpm --filter frontend build

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Migration check (alembic upgrade head + drift)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          uv run alembic upgrade head
          # `alembic check` exits non-zero if autogenerate would emit any ops,
          # i.e. the models and the migration history are out of sync.
          uv run alembic check

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Test (pytest)
        working-directory: backend
        run: uv run pytest -q
