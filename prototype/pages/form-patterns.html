<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pola Formulir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <script src="app.js"></script>
</head>
<body class="min-h-dvh">
  <header class="flex h-16 items-center gap-3 border-b border-outline-variant bg-surface-container-low px-4 sm:px-6">
    <span class="flex h-9 w-9 items-center justify-center rounded-md bg-primary text-primary-foreground"><span data-icon="clipboard-list" class="h-5 w-5"></span></span>
    <div class="leading-tight"><p class="text-sm font-semibold">Pola Formulir</p><p class="text-xs text-muted-foreground">Referensi komponen input & status</p></div>
    <button id="theme-toggle" class="ml-auto flex h-12 w-12 items-center justify-center rounded-full text-muted-foreground hover:bg-surface-container-high" aria-label="Ganti mode gelap"><span data-icon="moon" class="h-5 w-5" data-theme-icon></span></button>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">
    <!-- Text fields -->
    <section>
      <h2 class="text-lg font-semibold">Text Field</h2>
      <div class="mt-4 grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label for="f1" class="mb-1.5 block text-sm font-medium">Nama lengkap</label>
          <input id="f1" placeholder="mis. Budi Santoso" class="min-h-[48px] w-full rounded-sm border border-outline bg-background px-3 text-sm placeholder:text-muted-foreground focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
          <p class="mt-1 text-xs text-muted-foreground">Teks bantuan yang selalu tampak.</p>
        </div>
        <div>
          <label for="f2" class="mb-1.5 block text-sm font-medium">Terisi</label>
          <input id="f2" value="Siti Aminah" class="min-h-[48px] w-full rounded-sm border border-outline bg-background px-3 text-sm focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
        </div>
        <div>
          <label for="f3" class="mb-1.5 block text-sm font-medium">Nonaktif (disabled)</label>
          <input id="f3" value="Tidak dapat diubah" disabled class="min-h-[48px] w-full cursor-not-allowed rounded-sm border border-outline bg-surface-container px-3 text-sm text-muted-foreground opacity-60" />
        </div>
        <div>
          <label for="f4" class="mb-1.5 block text-sm font-medium">Error</label>
          <input id="f4" value="123" aria-invalid="true" class="min-h-[48px] w-full rounded-sm border border-destructive bg-background px-3 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-destructive" />
          <p class="mt-1 flex items-center gap-1 text-xs text-destructive"><span data-icon="alert-circle" class="h-3.5 w-3.5"></span>NISN harus terdiri dari 10 digit.</p>
        </div>
      </div>
    </section>

    <!-- Select + validation -->
    <section class="mt-10">
      <h2 class="text-lg font-semibold">Select & Status Validasi</h2>
      <div class="mt-4 grid grid-cols-1 gap-5 sm:grid-cols-3">
        <div>
          <label for="s1" class="mb-1.5 block text-sm font-medium">Jenjang</label>
          <div class="relative">
            <select id="s1" class="min-h-[48px] w-full appearance-none rounded-sm border border-outline bg-background px-3 pr-10 text-sm focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-ring">
              <option>SD</option><option>SMP</option><option>SMA</option>
            </select>
            <span data-icon="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></span>
          </div>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium">Sukses</label>
          <div class="flex min-h-[48px] items-center gap-2 rounded-sm border border-success bg-success-container px-3 text-sm text-success"><span data-icon="check-circle" class="h-4 w-4"></span>Tersimpan otomatis</div>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium">Peringatan</label>
          <div class="flex min-h-[48px] items-center gap-2 rounded-sm border border-warning bg-warning-container px-3 text-sm text-warning"><span data-icon="alert-triangle" class="h-4 w-4"></span>Data belum lengkap</div>
        </div>
      </div>
    </section>

    <!-- Multi-step wizard -->
    <section class="mt-10">
      <h2 class="text-lg font-semibold">Wizard Multi-langkah</h2>
      <div class="mt-4 rounded-lg border border-outline-variant bg-surface-container-low p-5">
        <ol class="flex items-center">
          <li class="flex flex-1 items-center">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-primary text-sm font-semibold text-primary-foreground"><span data-icon="check" class="h-4 w-4"></span></span>
            <span class="ml-2 hidden text-sm font-medium sm:block">Data Siswa</span>
            <span class="mx-3 h-0.5 flex-1 bg-primary"></span>
          </li>
          <li class="flex flex-1 items-center">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-primary text-sm font-semibold text-primary-foreground">2</span>
            <span class="ml-2 hidden text-sm font-medium sm:block">Data Orang Tua</span>
            <span class="mx-3 h-0.5 flex-1 bg-outline-variant"></span>
          </li>
          <li class="flex items-center">
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-surface-container-highest text-sm font-semibold text-muted-foreground">3</span>
            <span class="ml-2 hidden text-sm font-medium text-muted-foreground sm:block">Konfirmasi</span>
          </li>
        </ol>

        <div class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2">
          <div>
            <label for="w1" class="mb-1.5 block text-sm font-medium">Nama orang tua / wali</label>
            <input id="w1" placeholder="mis. Dewi Lestari" class="min-h-[48px] w-full rounded-sm border border-outline bg-background px-3 text-sm placeholder:text-muted-foreground focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
          </div>
          <div>
            <label for="w2" class="mb-1.5 block text-sm font-medium">Nomor HP</label>
            <input id="w2" type="tel" inputmode="numeric" placeholder="08xx xxxx xxxx" class="min-h-[48px] w-full rounded-sm border border-outline bg-background px-3 text-sm placeholder:text-muted-foreground focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" />
          </div>
        </div>

        <div class="mt-6 flex items-center justify-between">
          <button class="inline-flex min-h-[48px] items-center gap-1.5 rounded-full border border-outline px-5 text-sm font-medium hover:bg-surface-container-high"><span data-icon="chevron-left" class="h-4 w-4"></span>Kembali</button>
          <button class="inline-flex min-h-[48px] items-center gap-1.5 rounded-full bg-primary px-5 text-sm font-medium text-primary-foreground hover:opacity-90">Lanjut<span data-icon="chevron-right" class="h-4 w-4"></span></button>
        </div>
      </div>
    </section>

    <!-- Loading states -->
    <section class="mt-10 pb-10">
      <h2 class="text-lg font-semibold">Status Memuat</h2>
      <div class="mt-4 flex flex-wrap items-start gap-6">
        <button disabled class="inline-flex min-h-[48px] cursor-wait items-center gap-2 rounded-full bg-primary px-5 text-sm font-medium text-primary-foreground opacity-80">
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>Menyimpan…
        </button>
        <div class="w-72 rounded-lg border border-outline-variant bg-surface-container-low p-4">
          <div class="h-4 w-1/2 animate-pulse rounded-sm bg-surface-container-highest"></div>
          <div class="mt-3 h-3 w-3/4 animate-pulse rounded-sm bg-surface-container-highest"></div>
          <div class="mt-2 h-3 w-2/3 animate-pulse rounded-sm bg-surface-container-highest"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    SMS.hydrate(document);
    document.getElementById("theme-toggle").addEventListener("click", function () {
      SMS.applyTheme(!document.documentElement.classList.contains("dark"));
    });
  </script>
</body>
</html>
